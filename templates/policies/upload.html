{% extends "base.html" %}
{% block title %}Upload policy - InsureRemind{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6">
  <h1 class="h3 mb-3">Upload policy <small class="text-muted fs-6">Step 1 of 2</small></h1>
  <div class="card"><div class="card-body">
    <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button class="btn btn-primary">Upload &amp; read document</button>
      <a class="btn btn-link" href="{% url 'dashboard' %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
