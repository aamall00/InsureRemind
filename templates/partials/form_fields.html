{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}{% include "partials/field.html" %}{% endfor %}
<script>document.querySelectorAll('input:not([type=checkbox]):not([type=file]),select,textarea').forEach(function(e){e.classList.add(e.tagName==='SELECT'?'form-select':'form-control')});</script>
